name: output
on: push

jobs:
  create-output:
    runs-on: ubuntu-latest
    steps:
    - name: echo output
      id: check-output-1
      run: |
        echo "test=hello1" >> $GITHUB_OUTPUT
    - name: echo output
      id: check-output-2
      run: |
        echo "test=hello2" >> "$GITHUB_OUTPUT"
    - name: check output
      run: |
        echo ${{ steps.check-output-1.outputs.test }}
        echo ${{ steps.check-output-2.outputs.test }}
  